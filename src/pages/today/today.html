<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Today — Ibadah Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f8f9fa;--bg-accent:#f1f3f5;--card-bg:#ffffff;--card-border:#e9ecef;--shadow-sm:0 1px 2px rgba(0,0,0,0.05);--shadow-md:0 2px 8px rgba(0,0,0,0.06);--text:#1a1a2e;--text2:#6b7280;--text3:#9ca3af;--accent:#c9a84c;--accent-light:#d4b96a;--accent-dark:#b8952f;--accent-bg:rgba(201,168,76,0.08);--accent-border:rgba(201,168,76,0.2);--green:#16a34a;--green-bg:rgba(22,163,74,0.08);--orange:#d97706;--red:#dc2626;--red-bg:rgba(220,38,38,0.08);--border:#e5e7eb;--border-light:#f3f4f6;--radius:12px;--radius-sm:8px;--radius-lg:16px;--font:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;--font-arabic:'Noto Naskh Arabic','Amiri',serif;--font-heading:'Sora',system-ui,sans-serif;--transition:150ms cubic-bezier(0.4,0,0.2,1);line-height:1.6}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:clamp(14px,2.8vw,16px)}
    .tab-panel{display:none}
    main#page{max-width:720px;margin:0 auto;padding:0 16px}
    @media(min-width:1024px){main#page{max-width:800px}}
    .mpa-header{text-align:center;padding:clamp(10px,3vw,20px) 0 8px}
    .mpa-header h1{font-family:var(--font-heading);font-size:clamp(1.2rem,4vw,1.8rem);font-weight:700;color:var(--text);margin:0}
    .mpa-nav{display:flex;justify-content:center;gap:clamp(6px,2vw,16px);margin-top:8px;flex-wrap:wrap}
    .mpa-nav a{color:var(--accent);text-decoration:none;font-weight:500;font-size:clamp(0.82rem,2.2vw,0.95rem);padding:4px 8px;border-radius:var(--radius-sm);transition:background var(--transition)}
    .mpa-nav a:hover{background:var(--accent-bg)}
    .mpa-nav a[aria-current="page"]{color:var(--accent-dark);font-weight:700}
    @media(max-width:400px){.mpa-nav{gap:6px}.mpa-nav a{font-size:0.8rem;padding:3px 6px}}
    .cat-chips{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding:8px 0 4px;scrollbar-width:none}
    .cat-chips::-webkit-scrollbar{display:none}
    .cat-chips .cat-chip{flex:0 0 auto;background:var(--bg-accent);border:1px solid var(--border);color:var(--text2);padding:10px 16px;min-height:40px;border-radius:20px;font-size:clamp(0.78rem,2.2vw,0.9rem);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
    .cat-chips .cat-chip.active{color:var(--accent-dark);background:var(--accent-bg);border-color:var(--accent-border)}
    @media(min-width:768px){.cat-chips{flex-wrap:wrap;overflow-x:visible;justify-content:flex-start}}
    .tier2-tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;margin-top:8px;padding:4px 0;scrollbar-width:none}
    .tier2-tabs::-webkit-scrollbar{display:none}
    .tier2-tabs .t2-btn{flex:0 0 auto;background:var(--bg-accent);border:1px solid var(--border);color:var(--text2);padding:10px 16px;border-radius:20px;font-size:clamp(0.8rem,2.2vw,0.9rem);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:40px}
    .tier2-tabs .t2-btn.active{color:var(--accent-dark);background:var(--accent-bg);border-color:var(--accent-border)}
  </style>
  <link rel="preload" href="/styles/main.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <script>
    (function () {
      try { var t = localStorage.getItem('iqTheme'); if (t && t !== 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    })();
  </script>
</head>
<body data-page="today">
  <div id="shell"></div>
  <script type="module" src="./entry.js"></script>
</body>
</html>
