<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background rounded square (squircle) for app icon / favicon usage -->
    <linearGradient id="iqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c3b36"/>
      <stop offset="100%" stop-color="#082824"/>
    </linearGradient>
    <linearGradient id="iqGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c25a"/>
      <stop offset="50%" stop-color="#e5b045"/>
      <stop offset="100%" stop-color="#c9952f"/>
    </linearGradient>
  </defs>

  <!-- Dark Emerald App Container -->
  <rect width="512" height="512" rx="108" fill="url(#iqBgGrad)"/>

  <!-- 8-Pointed Star (Rub el Hizb) formed by two rotated rounded squares -->
  <g id="rubElHizb" transform="translate(256,256)">
    <rect x="-142" y="-142" width="284" height="284" rx="36" ry="36" fill="url(#iqGoldGrad)"/>
    <rect x="-142" y="-142" width="284" height="284" rx="36" ry="36" fill="url(#iqGoldGrad)" transform="rotate(45)"/>
    
    <!-- Central Emerald Medallion -->
    <circle cx="0" cy="0" r="112" fill="#0c3b36"/>

    <!-- Golden Crescent Moon -->
    <path fill="url(#iqGoldGrad)" d="M -16 -68 C 22 -68 54 -40 54 0 C 54 40 22 68 -16 68 C 12 56 32 30 32 0 C 32 -30 12 -56 -16 -68 Z"/>

    <!-- Ivory 8-Pointed Star -->
    <g transform="translate(32, -8) scale(0.68)">
      <polygon points="0,-22 6,-8 20,-8 10,2 14,16 0,8 -14,16 -10,2 -20,-8 -6,-8" fill="#f7f4ea"/>
    </g>
  </g>
</svg>
