<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c25a"/>
      <stop offset="50%" stop-color="#e5b045"/>
      <stop offset="100%" stop-color="#c9952f"/>
    </linearGradient>
  </defs>

  <!-- 8-Pointed Star (Rub el Hizb) -->
  <g transform="translate(256,256)">
    <rect x="-170" y="-170" width="340" height="340" rx="42" ry="42" fill="url(#iqGold)"/>
    <rect x="-170" y="-170" width="340" height="340" rx="42" ry="42" fill="url(#iqGold)" transform="rotate(45)"/>
    
    <!-- Central Emerald Medallion -->
    <circle cx="0" cy="0" r="135" fill="#0c3b36"/>

    <!-- Golden Crescent Moon -->
    <path fill="url(#iqGold)" d="M -20 -82 C 26 -82 66 -48 66 0 C 66 48 26 82 -20 82 C 14 68 38 36 38 0 C 38 -36 14 -68 -20 -82 Z"/>

    <!-- Ivory Star -->
    <g transform="translate(40, -10) scale(0.8)">
      <polygon points="0,-22 6,-8 20,-8 10,2 14,16 0,8 -14,16 -10,2 -20,-8 -6,-8" fill="#f7f4ea"/>
    </g>
  </g>
</svg>
