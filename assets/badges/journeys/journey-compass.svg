<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="badgeClip">
      <path d="M256 60 A196 196 0 1 1 255.9 60 Z"/>
    </clipPath>
    <linearGradient id="gloss" x1="0.15" y1="0" x2="0.65" y2="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimDefault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D9A84E"/>
      <stop offset="100%" stop-color="#9E6F1E"/>
    </linearGradient>
    
        <linearGradient id="rimBrass" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FEF08A"/><stop offset="100%" stop-color="#B45309"/></linearGradient>
        <radialGradient id="bgCompassTeal" cx="0.5" cy="0.45" r="0.65"><stop offset="0%" stop-color="#F0FDFA"/><stop offset="65%" stop-color="#99F6E4"/><stop offset="100%" stop-color="#0D9488"/></radialGradient>
      
  </defs>
  <!-- Soft grounded shadow -->
  <g transform="translate(0, 12)" opacity="0.2">
    <path d="M256 60 A196 196 0 1 1 255.9 60 Z" fill="#0F172A" stroke="#0F172A" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
    
  </g>
  <!-- Thick white sticker border -->
  <g>
    <path d="M256 60 A196 196 0 1 1 255.9 60 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
    
  </g>
  <!-- Colored / metallic rim -->
  <path d="M256 60 A196 196 0 1 1 255.9 60 Z" fill="url(#rimBrass)"/>
  <!-- Inner background clipped cleanly -->
  <g clip-path="url(#badgeClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bgCompassTeal)"/>
    <path d="M256 60 A196 196 0 1 1 255.9 60 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="18" transform="translate(256,256) scale(0.915) translate(-256,-256)"/>
    
        <!-- Compass Ring & Cardinal Ticks (NO N/S/E/W letters!) -->
        <circle cx="256" cy="256" r="136" fill="none" stroke="#0F766E" stroke-width="6" stroke-dasharray="10 14"/>
        <polygon points="256,96 266,120 246,120" fill="#B45309"/>
        <polygon points="256,416 266,392 246,392" fill="#0F766E"/>
        <polygon points="96,256 120,246 120,266" fill="#0F766E"/>
        <polygon points="416,256 392,246 392,266" fill="#0F766E"/>
        <!-- Compass Needle tilted NE -->
        <g transform="rotate(32 256 256)">
          <polygon points="256,124 286,256 226,256" fill="#F43F5E" stroke="#881337" stroke-width="3"/>
          <polygon points="256,388 286,256 226,256" fill="#F8FAFC" stroke="#0F766E" stroke-width="3"/>
        </g>
        <circle cx="256" cy="256" r="24" fill="#FBBF24" stroke="#92400E" stroke-width="4"/>
        <circle cx="256" cy="256" r="9" fill="#FFFBEB"/>
      
    <!-- Top-left glossy highlight arc -->
    <ellipse cx="195" cy="115" rx="170" ry="95" transform="rotate(-18 195 115)" fill="url(#gloss)"/>
  </g>
  <!-- Crisp inner bevel border -->
  <path d="M256 60 A196 196 0 1 1 255.9 60 Z" fill="none" stroke="url(#rimBrass)" stroke-width="12"/>
  <path d="M256 60 A196 196 0 1 1 255.9 60 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5" transform="translate(256,256) scale(0.955) translate(-256,-256)"/>
</svg>