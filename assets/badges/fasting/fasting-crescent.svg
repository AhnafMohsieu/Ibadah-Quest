      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimDefault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D9A84E"/>
      <stop offset="100%" stop-color="#9E6F1E"/>
    </linearGradient>
    
        <linearGradient id="rimWarmGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FEF08A"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
        <radialGradient id="bgNightTeal" cx="0.5" cy="0.38" r="0.65"><stop offset="0%" stop-color="#0D9488"/><stop offset="60%" stop-color="#0F172A"/><stop offset="100%" stop-color="#020617"/></radialGradient>
      
  </defs>
