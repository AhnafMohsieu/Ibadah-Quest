<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page Not Found — Ibadah Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/icons/favicon.png" type="image/png">
  <style>
    :root {
      --bg: #f2fbf8;
      --card-bg: #ffffff;
      --card-border: rgba(11,122,117,0.14);
      --text: #0b2528;
      --text2: #4b6b6e;
      --accent: #0b8a82;
      --accent-dark: #075e64;
      --accent-bg: rgba(11,138,130,0.10);
      --font: 'Sora', system-ui, -apple-system, sans-serif;
      --font-arabic: 'Amiri', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .arabic {
      font-family: var(--font-arabic);
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      font-weight: 700;
    }
    p {
      color: var(--text2);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="arabic">إِنَّا لِلَّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ</div>
    <h1>404 — Page Not Found</h1>
    <p>The page or resource you are looking for does not exist or has been moved.</p>
    <a href="https://ahnafmohsieu.github.io/Ibadah-Quest/" class="btn">Return to Ibadah Quest</a>
  </div>
</body>
</html>
